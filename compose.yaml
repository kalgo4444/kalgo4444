services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    image: kalgo4444
    ports:
      # Use "127.0.0.1:3000:3000" if a reverse proxy on this host fronts the site.
      - "3000:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
